<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS Music Player - Elegant UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .music-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .music-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .play-btn-hover {
            opacity: 0;
            transition: opacity 0.3s;
        }

        .music-card:hover .play-btn-hover {
            opacity: 1;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 10px;
        }

        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-playing {
            animation: pulse-slow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="pb-32">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center sticky top-0 z-50 glass mb-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/50">
                <i class="fas fa-music text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">REZNCS <span class="text-indigo-400">Music</span></h1>
        </div>
        <div class="hidden md:flex gap-6 text-sm font-medium">
            <a href="#" class="hover:text-indigo-400 transition">Discover</a>
            <a href="#" class="hover:text-indigo-400 transition">Genres</a>
            <a href="#" class="hover:text-indigo-400 transition">Charts</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4">
        <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
            <i class="fas fa-fire text-orange-500"></i> New Releases
        </h2>
        
        <!-- Loading Spinner -->
        <div id="loading" class="flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500"></div>
        </div>

        <!-- Music Grid -->
        <div id="music-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <!-- JS will inject cards here -->
        </div>
    </main>

    <!-- Player Bottom Bar -->
    <footer id="player-bar" class="fixed bottom-0 left-0 right-0 glass p-4 translate-y-full transition-transform duration-500 z-50">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4 w-1/3">
                <img id="now-playing-img" src="" class="w-14 h-14 rounded-md object-cover animate-playing shadow-lg" alt="">
                <div class="overflow-hidden">
                    <h4 id="now-playing-title" class="font-bold truncate"></h4>
                    <p id="now-playing-artist" class="text-xs text-gray-400 truncate"></p>
                </div>
            </div>

            <div class="flex flex-col items-center w-1/3 gap-2">
                <div class="flex items-center gap-6">
                    <button class="hover:text-indigo-400 transition"><i class="fas fa-random"></i></button>
                    <button class="hover:text-indigo-400 transition text-xl"><i class="fas fa-step-backward"></i></button>
                    <button id="main-play-btn" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-110 transition active:scale-95 shadow-lg">
                        <i class="fas fa-play ml-1"></i>
                    </button>
                    <button class="hover:text-indigo-400 transition text-xl"><i class="fas fa-step-forward"></i></button>
                    <button class="hover:text-indigo-400 transition"><i class="fas fa-redo"></i></button>
                </div>
                <div class="w-full bg-gray-700 h-1 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-100"></div>
                </div>
            </div>

            <div class="flex items-center justify-end gap-4 w-1/3">
                <i class="fas fa-volume-up text-gray-400"></i>
                <div class="w-24 bg-gray-700 h-1 rounded-full">
                    <div class="bg-white h-full w-2/3"></div>
                </div>
                <a id="download-link" href="#" target="_blank" class="bg-indigo-600/20 hover:bg-indigo-600 p-2 rounded-full transition text-xs">
                    <i class="fas fa-download"></i>
                </a>
            </div>
        </div>
    </footer>

    <audio id="audio-player"></audio>

    <script>
        const musicGrid = document.getElementById('music-grid');
        const loading = document.getElementById('loading');
        const playerBar = document.getElementById('player-bar');
        const audioPlayer = document.getElementById('audio-player');
        const mainPlayBtn = document.getElementById('main-play-btn');
        const progressBar = document.getElementById('progress-bar');

        let isPlaying = false;

        async function fetchMusic() {
            try {
                const response = await fetch('https://api.sxtream.my.id/audio/ncs-music');
                const data = await response.json();
                renderMusic(data.result);
                loading.style.display = 'none';
            } catch (error) {
                console.error('Error fetching music:', error);
                musicGrid.innerHTML = `<p class="text-red-400 col-span-full text-center">Gagal memuat musik...</p>`;
            }
        }

        function renderMusic(songs) {
            musicGrid.innerHTML = songs.map((song, index) => `
                <div class="music-card glass p-4 rounded-2xl cursor-pointer group" onclick="playMusic('${song.download_url}', '${song.title}', '${song.artists}', '${song.image_url}')">
                    <div class="relative mb-4 overflow-hidden rounded-xl">
                        <img src="${song.image_url}" alt="${song.title}" class="w-full aspect-square object-cover group-hover:scale-110 transition duration-500">
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center play-btn-hover">
                            <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center shadow-xl">
                                <i class="fas fa-play text-white ml-1"></i>
                            </div>
                        </div>
                        <span class="absolute top-2 right-2 bg-black/60 text-[10px] px-2 py-1 rounded-md backdrop-blur-md">${song.genre || 'NCS'}</span>
                    </div>
                    <h3 class="font-bold truncate text-sm mb-1">${song.title}</h3>
                    <p class="text-xs text-gray-400 truncate">${song.artists}</p>
                    <p class="text-[10px] text-gray-500 mt-2 flex justify-between">
                        <span>${song.release_info}</span>
                        <i class="fas fa-ellipsis-h hover:text-white"></i>
                    </p>
                </div>
            `).join('');
        }

        function playMusic(url, title, artist, img) {
            audioPlayer.src = url;
            audioPlayer.play();
            isPlaying = true;
            
            // Update UI Player Bar
            document.getElementById('now-playing-img').src = img;
            document.getElementById('now-playing-title').innerText = title;
            document.getElementById('now-playing-artist').innerText = artist;
            document.getElementById('download-link').href = url;
            
            playerBar.classList.remove('translate-y-full');
            mainPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }

        mainPlayBtn.addEventListener('click', () => {
            if (isPlaying) {
                audioPlayer.pause();
                mainPlayBtn.innerHTML = '<i class="fas fa-play ml-1"></i>';
            } else {
                audioPlayer.play();
                mainPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
            isPlaying = !isPlaying;
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressBar.style.width = `${progress}%`;
        });

        // Load music on start
        fetchMusic();
    </script>
</body>
</html>
