<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rezToolsAi - GPT 3.5 Turbo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .typing-cursor::after {
            content: '█';
            animation: blink 0.8s infinite;
            color: #38bdf8;
            margin-left: 5px;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade { animation: fadeInUp 0.6s ease-out forwards; }

        .custom-loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-10">

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center mb-10 animate-fade">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-gradient-to-tr from-sky-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-sky-500/20">
                <i class="fas fa-bolt text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight">rez<span class="gradient-text">ToolsAi</span></h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">GPT-3.5 Turbo Engine</p>
            </div>
        </div>
        <div class="hidden md:block text-xs font-medium text-slate-400 bg-slate-800/50 px-4 py-2 rounded-full border border-slate-700">
            <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-2"></span> System Ready
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl flex-grow">
        <div class="glass rounded-[2.5rem] p-6 md:p-10 shadow-2xl animate-fade" style="animation-delay: 0.1s;">
            
            <!-- Chat Input -->
            <div class="mb-10">
                <div class="relative group">
                    <textarea id="userInput" rows="2" 
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-3xl py-5 pl-7 pr-32 focus:outline-none focus:ring-2 focus:ring-sky-500/50 transition-all text-slate-200 placeholder:text-slate-600 resize-none shadow-inner"
                        placeholder="Tanyakan sesuatu pada rezToolsAi..."></textarea>
                    
                    <div class="absolute right-3 bottom-3 flex gap-2">
                        <!-- Tombol Clip/Upload -->
                        <button onclick="document.getElementById('fileInput').click()" 
                            class="w-12 h-12 flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-2xl transition-all border border-slate-700">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="handleFileUpload(this)">

                        <!-- Tombol Kirim -->
                        <button onclick="sendRequest()" id="sendBtn" 
                            class="bg-sky-500 hover:bg-sky-600 text-white px-6 rounded-2xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-sky-500/20">
                            <span id="btnText">Kirim</span>
                            <div class="custom-loader" id="loader"></div>
                        </button>
                    </div>
                </div>

                <!-- Image Preview Area -->
                <div id="imagePreview" class="hidden mt-4 p-3 bg-sky-500/5 rounded-2xl border border-sky-500/20 flex items-center gap-4 animate-fade">
                    <img id="previewImg" src="" class="w-14 h-14 object-cover rounded-xl border border-slate-700">
                    <div class="flex-grow">
                        <p class="text-xs font-bold text-sky-400 uppercase tracking-wider">File Terdeteksi</p>
                        <p id="uploadStatus" class="text-[10px] text-slate-500 truncate max-w-[200px]">Mengunggah ke server...</p>
                    </div>
                    <button onclick="cancelUpload()" class="text-slate-500 hover:text-red-400 px-3"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <!-- Chat Output -->
            <div id="resultBox" class="hidden border-t border-slate-800/50 pt-8 mt-4 animate-fade">
                <div class="flex items-start gap-5">
                    <div class="w-12 h-12 shrink-0 bg-slate-800 rounded-2xl flex items-center justify-center border border-slate-700 shadow-lg">
                        <i class="fas fa-robot text-sky-400 text-xl"></i>
                    </div>
                    <div class="flex-grow pt-1">
                        <div id="output" class="text-slate-300 leading-relaxed text-lg min-h-[40px] whitespace-pre-line">
                            <!-- Response ketik muncul di sini -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-slate-600 text-[10px] uppercase tracking-[0.3em] font-bold pb-10">
        &copy; 2026 rezToolsAi &bull; API SXTREAM
    </footer>

    <script>
        let currentImageUrl = "";

        // Fungsi Upload Image (ImgBB)
        async function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            document.getElementById('imagePreview').classList.remove('hidden');
            document.getElementById('previewImg').src = URL.createObjectURL(file);
            document.getElementById('uploadStatus').innerText = "Uploading...";

            const formData = new FormData();
            formData.append("image", file);

            try {
                const res = await fetch("https://api.imgbb.com/1/upload?key=89324022ee783689401765ed99691456", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                if(data.success) {
                    currentImageUrl = data.data.url;
                    document.getElementById('uploadStatus').innerText = "URL: " + currentImageUrl;
                }
            } catch (err) {
                document.getElementById('uploadStatus').innerText = "Gagal mengunggah gambar.";
            }
        }

        function cancelUpload() {
            currentImageUrl = "";
            document.getElementById('fileInput').value = "";
            document.getElementById('imagePreview').classList.add('hidden');
        }

        // Fungsi Kirim Pesan
        async function sendRequest() {
            const input = document.getElementById('userInput');
            const output = document.getElementById('output');
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btnText');

            if (!input.value && !currentImageUrl) return;

            // UI State Loading
            loader.style.display = 'block';
            btnText.style.display = 'none';
            resultBox.classList.remove('hidden');
            output.innerHTML = "";
            output.classList.add('typing-cursor');

            // Persiapan Query
            let queryText = input.value;
            if (currentImageUrl) {
                queryText = `[User mengirim link gambar: ${currentImageUrl}] \n\nPertanyaan: ${input.value || "Tolong jelaskan gambar ini"}`;
            }

            try {
                // Fetch ke API GPT-3.5
                const response = await fetch(`https://api.sxtream.my.id/ai/ai-gpt-3.5?query=${encodeURIComponent(queryText)}`);
                const data = await response.json();

                if (data.status) {
                    // Gunakan data.data sesuai JSON respon API GPT-3.5
                    typeWriter(data.data, output);
                } else {
                    output.innerText = "Error: Terjadi kendala teknis pada server.";
                }
            } catch (error) {
                output.innerText = "Error: Koneksi internet bermasalah.";
            } finally {
                loader.style.display = 'none';
                btnText.style.display = 'block';
                cancelUpload();
                input.value = "";
            }
        }

        // Efek Mengetik Animasi
        function typeWriter(text, element) {
            let i = 0;
            const speed = 15; // Kecepatan mengetik
            element.innerHTML = "";

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                    // Scroll otomatis ke bawah
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                } else {
                    element.classList.remove('typing-cursor');
                }
            }
            type();
        }

        // Event Listener Enter
        document.getElementById("userInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendRequest();
            }
        });
    </script>
</body>
                </html>
